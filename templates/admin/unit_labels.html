<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Etiketten – {{ item.name }}</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, 'Segoe UI', Roboto, sans-serif; padding: 20px; background: #f5f5f5; }
        .toolbar { margin-bottom: 20px; display: flex; gap: 10px; align-items: center; }
        .toolbar button { padding: 8px 20px; font-size: 1em; cursor: pointer; }
        .labels { display: flex; flex-wrap: wrap; gap: 8px; }
        .label {
            border: 1px dashed #999;
            border-radius: 3px;
            padding: 2mm;
            background: #fff;
            page-break-inside: avoid;
        }
        .label img { display: block; height: 22mm; width: auto; }
        .qr-missing { font-size: 7pt; color: #c00; }
        @media print {
            body { background: #fff; padding: 0; }
            .toolbar { display: none; }
            .label { border-color: #ccc; }
        }
    </style>
</head>
<body>
    <div class="toolbar">
        <button onclick="window.print()">🖨 Drucken</button>
        {% if single_unit %}
            <a href="{{ url_for('admin.unit_label_png', unit_id=single_unit.id) }}"><button>⬇ PNG</button></a>
            <a href="{{ url_for('admin.unit_label_lbx', unit_id=single_unit.id) }}"><button>⬇ P-touch (.lbx)</button></a>
        {% else %}
            <a href="{{ url_for('admin.unit_labels_zip', item_id=item.id) }}"><button>⬇ PNG (ZIP)</button></a>
            <a href="{{ url_for('admin.unit_labels_lbx_all', item_id=item.id) }}"><button>⬇ P-touch (.lbx)</button></a>
        {% endif %}
        <button onclick="window.close()">Schließen</button>
        <span>{{ labels|length }} Etikett(en) – {{ item.name }}</span>
    </div>
    <div class="labels">
        {% for l in labels %}
        <div class="label">
            {% if l.qr %}
                <img src="{{ url_for('admin.unit_label_png', unit_id=l.unit.id) }}" alt="Etikett {{ l.unit.asset_tag or l.unit.id }}">
            {% else %}
                <span class="qr-missing">QR-Bibliothek fehlt<br>(pip install segno)</span>
            {% endif %}
        </div>
        {% endfor %}
        {% if not labels %}
        <p>Keine Einheiten vorhanden.</p>
        {% endif %}
    </div>
</body>
</html>
