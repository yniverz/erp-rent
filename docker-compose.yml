version: '3.8'

services:
  web:
    build: .
    ports:
      - "5000:5000"
    environment:
      - PYTHONUNBUFFERED=1
      # Required: random, >= 32 chars (python -c "import secrets; print(secrets.token_hex(32))")
      - SECRET_KEY=${SECRET_KEY:?SECRET_KEY must be set}
      # Cookies are HTTPS-only; set to 0 only for plain-http local testing
      - COOKIE_SECURE=${COOKIE_SECURE:-1}
      - ADMIN_USERNAME=${ADMIN_USERNAME:-admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-password123}
      - FLASK_ENV=production
      # Optional SMTP for inquiry notifications
      - SMTP_SERVER=${SMTP_SERVER:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - SMTP_FROM=${SMTP_FROM:-}
      # Optional fallback favicon URL (better: set it in Admin → Einstellungen)
      - FAVICON_URL=${FAVICON_URL:-}
      # Optional REST API (comma-separated bearer tokens; API disabled if unset)
      - API_TOKENS=${API_TOKENS:-}
      # Public https base URL (needed behind a reverse proxy for the Claude/MCP OAuth flow)
      - PUBLIC_URL=${PUBLIC_URL:-}
    volumes:
      - ./instance:/app/instance
    restart: unless-stopped
